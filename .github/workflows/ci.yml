name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q create_iso.py tests

      - name: Run tests
        run: python -m pytest -q

      - name: Verify committed artifact parity
        run: python create_iso.py --check

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-system-x86

      - name: Build media for headless boot smoke tests
        run: python create_iso.py --output-dir build

      - name: Boot floppy and ISO and verify debug telemetry
        shell: bash
        run: |
          set -euo pipefail

          run_boot_smoke() {
            local label="$1"
            local log_path="$2"
            shift 2
            rm -f "${log_path}"

            set +e
            timeout --signal=TERM --kill-after=2s 10s \
              qemu-system-i386 \
                -machine pc,accel=tcg \
                -m 16M \
                -display none \
                -monitor none \
                -serial none \
                -nic none \
                -no-reboot \
                -no-shutdown \
                -debugcon "file:${log_path}" \
                -global isa-debugcon.iobase=0xe9 \
                "$@"
            local qemu_status=$?
            set -e

            if [[ "${qemu_status}" -ne 124 ]]; then
              echo "::error::${label} QEMU exited before the smoke-test timeout (status ${qemu_status})"
              if [[ -f "${log_path}" ]]; then
                od -An -tx1 -v "${log_path}"
              fi
              return 1
            fi
          }

          run_boot_smoke \
            "floppy" \
            "build/floppy.debug" \
            -boot a \
            -drive file=build/floppy.img,format=raw,if=floppy

          run_boot_smoke \
            "ISO" \
            "build/iso.debug" \
            -boot d \
            -drive file=build/os.iso,format=raw,media=cdrom,readonly=on

          python - <<'PY'
          from pathlib import Path

          for label, path in (
              ("floppy", Path("build/floppy.debug")),
              ("ISO", Path("build/iso.debug")),
          ):
              telemetry = path.read_bytes()
              boot = telemetry.find(b"B")
              kernel = telemetry.find(b"K", boot + 1)
              frame = telemetry.find(b"F", kernel + 1)

              if not (0 <= boot < kernel < frame):
                  raise SystemExit(
                      f"{label}: missing ordered B -> K -> F markers; "
                      f"telemetry={telemetry.hex()}"
                  )
              if len(telemetry) < frame + 4 or telemetry[frame + 3] != 0x0A:
                  raise SystemExit(
                      f"{label}: incomplete first telemetry frame; "
                      f"telemetry={telemetry.hex()}"
                  )

              print(
                  f"{label}: boot smoke passed with "
                  f"{telemetry[:frame + 4].hex()}"
              )
          PY
