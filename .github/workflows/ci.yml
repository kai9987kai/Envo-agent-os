name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          create_iso.py envo_config.py envo_reference.py
          envo_telemetry.py run_experiment.py tests

      - name: Lint Python sources
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest -q

      - name: Verify committed artifact parity
        run: python create_iso.py --check

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-system-x86

      - name: Build media for headless boot smoke tests
        run: python create_iso.py --output-dir build

      - name: Boot floppy and ISO and verify debug telemetry
        shell: bash
        run: |
          set -euo pipefail

          run_boot_smoke() {
            local label="$1"
            local log_path="$2"
            shift 2
            rm -f "${log_path}"

            set +e
            timeout --signal=TERM --kill-after=2s 10s \
              qemu-system-i386 \
                -machine pc,accel=tcg \
                -m 16M \
                -display none \
                -monitor none \
                -serial none \
                -nic none \
                -no-reboot \
                -no-shutdown \
                -debugcon "file:${log_path}" \
                -global isa-debugcon.iobase=0xe9 \
                "$@"
            local qemu_status=$?
            set -e

            if [[ "${qemu_status}" -ne 124 ]]; then
              echo "::error::${label} QEMU exited before the smoke-test timeout (status ${qemu_status})"
              if [[ -f "${log_path}" ]]; then
                od -An -tx1 -v "${log_path}"
              fi
              return 1
            fi
          }

          run_boot_smoke \
            "floppy" \
            "build/floppy.debug" \
            -boot a \
            -drive file=build/floppy.img,format=raw,if=floppy

          run_boot_smoke \
            "ISO" \
            "build/iso.debug" \
            -boot d \
            -drive file=build/os.iso,format=raw,media=cdrom,readonly=on

          python - <<'PY'
          from pathlib import Path

          from envo_config import load_model_config
          from envo_reference import ReferenceModel
          from envo_telemetry import (
              load_experiment_config_id,
              verify_config_id,
          )
          from run_experiment import validate_trace_sequence

          experiment_path = Path("build/experiment.json")
          config = load_model_config(experiment_path)
          expected_config_id = load_experiment_config_id(experiment_path)
          traces = {}
          for label, path in (
              ("floppy", Path("build/floppy.debug")),
              ("ISO", Path("build/iso.debug")),
          ):
              telemetry = path.read_bytes()
              boot = telemetry.find(b"B")
              kernel = telemetry.find(b"K", boot + 1)
              if not (0 <= boot < kernel):
                  raise SystemExit(
                      f"{label}: missing ordered B -> K stage markers; "
                      f"telemetry={telemetry.hex()}"
                  )
              first_frame = telemetry.find(b"EV", kernel + 1)
              if first_frame < 0:
                  raise SystemExit(
                      f"{label}: no telemetry frame header after K marker; "
                      f"telemetry={telemetry.hex()}"
                  )

              # QEMU is deliberately terminated at the timeout, so its final
              # frame may be partial. All complete frames must remain aligned,
              # checksummed, and gap-free from the first configured tick.
              frames = validate_trace_sequence(
                  telemetry,
                  config.telemetry_interval,
              )
              if not frames:
                  raise SystemExit(
                      f"{label}: no valid v3 telemetry frame; "
                      f"telemetry={telemetry.hex()}"
                  )
              verify_config_id(frames, expected_config_id)
              reference_by_tick = {
                  frame.tick: frame
                  for frame in ReferenceModel(config).run(frames[-1].tick)
              }

              for index, frame in enumerate(frames):
                  speed_total = (
                      frame.speed_1_count
                      + frame.speed_2_count
                      + frame.speed_3_count
                      + frame.speed_4_count
                  )
                  predator_speed_total = (
                      frame.predator_speed_1_count
                      + frame.predator_speed_2_count
                      + frame.predator_speed_3_count
                      + frame.predator_speed_4_count
                  )
                  if frame.tick & (config.telemetry_interval - 1):
                      raise SystemExit(
                          f"{label}: frame {index} tick {frame.tick} is not "
                          f"aligned to interval {config.telemetry_interval}"
                      )
                  if speed_total != config.prey_count:
                      raise SystemExit(
                          f"{label}: frame {index} speed bins total "
                          f"{speed_total}, expected {config.prey_count}"
                      )
                  if predator_speed_total != config.predator_count:
                      raise SystemExit(
                          f"{label}: frame {index} predator speed bins total "
                          f"{predator_speed_total}, expected "
                          f"{config.predator_count}"
                      )
                  if not (
                      config.sense_min * config.prey_count
                      <= frame.prey_sense_sum
                      <= config.sense_max * config.prey_count
                  ):
                      raise SystemExit(
                          f"{label}: frame {index} prey sense sum "
                          f"{frame.prey_sense_sum} is outside configured bounds"
                      )
                  if not (
                      config.sense_min * config.predator_count
                      <= frame.predator_sense_sum
                      <= config.sense_max * config.predator_count
                  ):
                      raise SystemExit(
                          f"{label}: frame {index} predator sense sum "
                          f"{frame.predator_sense_sum} is outside configured "
                          "bounds"
                      )
                  if not (
                      0
                      < frame.prey_energy_sum
                      <= config.reproduction_energy * config.prey_count
                  ):
                      raise SystemExit(
                          f"{label}: frame {index} prey energy sum "
                          f"{frame.prey_energy_sum} is outside model bounds"
                      )
                  if not (
                      0
                      < frame.predator_energy_sum
                      <= (
                          config.predator_reproduction_energy
                          * config.predator_count
                      )
                  ):
                      raise SystemExit(
                          f"{label}: frame {index} predator energy sum "
                          f"{frame.predator_energy_sum} is outside model bounds"
                      )
                  event_replacements = (
                      frame.captures
                      + frame.starvations
                      + frame.forager_turnovers
                  ) & 0xFFFF
                  if frame.replacements != event_replacements:
                      raise SystemExit(
                          f"{label}: frame {index} replacement accounting "
                          "does not match capture/starvation/turnover counters"
                      )
                  if frame.max_generation > frame.replacements:
                      raise SystemExit(
                          f"{label}: frame {index} generation "
                          f"{frame.max_generation} exceeds replacement count "
                          f"{frame.replacements}"
                      )
                  predator_event_replacements = (
                      frame.predator_starvations
                      + frame.predator_forager_turnovers
                  ) & 0xFFFF
                  if (
                      frame.predator_replacements
                      != predator_event_replacements
                  ):
                      raise SystemExit(
                          f"{label}: frame {index} predator replacement "
                          "accounting does not match starvation/turnover "
                          "counters"
                      )
                  if (
                      frame.predator_max_generation
                      > frame.predator_replacements
                  ):
                      raise SystemExit(
                          f"{label}: frame {index} predator generation "
                          f"{frame.predator_max_generation} exceeds "
                          "replacement count "
                          f"{frame.predator_replacements}"
                      )
                  if reference_by_tick.get(frame.tick) != frame:
                      raise SystemExit(
                          f"{label}: frame {index} differs from the exact "
                          f"Python reference at tick {frame.tick}; "
                          f"guest={frame!r}; "
                          f"reference={reference_by_tick.get(frame.tick)!r}"
                      )
                  if index:
                      tick_step = (frame.tick - frames[index - 1].tick) & 0xFFFF
                      if tick_step != config.telemetry_interval:
                          raise SystemExit(
                              f"{label}: frame {index} tick step {tick_step}, "
                              f"expected {config.telemetry_interval}"
                          )
                  elif frame.tick != config.telemetry_interval:
                      raise SystemExit(
                          f"{label}: first frame tick {frame.tick}, expected "
                          f"{config.telemetry_interval}"
                      )

              traces[label] = frames
              print(
                  f"{label}: boot smoke passed at tick "
                  f"{frames[0].tick} with state checksum "
                  f"0x{frames[0].state_checksum:04x}"
              )

          common_frames = min(len(traces["floppy"]), len(traces["ISO"]))
          if common_frames < 1:
              raise SystemExit("no common valid floppy/ISO telemetry prefix")
          for index in range(common_frames):
              floppy_frame = traces["floppy"][index]
              iso_frame = traces["ISO"][index]
              if floppy_frame.tick != iso_frame.tick:
                  raise SystemExit(
                      f"frame {index}: floppy/ISO tick mismatch "
                      f"{floppy_frame.tick} != {iso_frame.tick}"
                  )
              if floppy_frame.state_checksum != iso_frame.state_checksum:
                  raise SystemExit(
                      f"frame {index}: floppy/ISO state checksum mismatch "
                      f"0x{floppy_frame.state_checksum:04x} != "
                      f"0x{iso_frame.state_checksum:04x}"
                  )
              if floppy_frame != iso_frame:
                  raise SystemExit(
                      f"frame {index}: floppy/ISO payload mismatch; "
                      f"floppy={floppy_frame!r}; ISO={iso_frame!r}"
                  )
          print(
              f"floppy/ISO deterministic prefix: {common_frames} "
              "checksummed frames"
          )
          PY

      - name: Differentially boot a non-default event-path experiment
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from dataclasses import replace
          from pathlib import Path

          from create_iso import VERSION
          from envo_config import ModelConfig, build_experiment_document

          config = replace(
              ModelConfig(),
              seed=1,
              food_count=12,
              prey_count=3,
              predator_count=3,
              initial_energy=20,
              reproduction_energy=60,
              predator_reproduction_energy=60,
              mutation_mask=1,
              sense_mutation_step=127,
              day_night_mask=1,
              waterline=2,
              telemetry_interval=4,
              prey_base_metabolism=2,
              predator_base_metabolism=2,
              speed_metabolism=2,
              sense_metabolism_shift=4,
          )
          Path("build-custom-config.json").write_bytes(
              build_experiment_document(config, VERSION)
          )
          PY

          python create_iso.py \
            --config build-custom-config.json \
            --output-dir build-custom
          python run_experiment.py \
            build-custom/floppy.img \
            --media-type floppy \
            --experiment build-custom/experiment.json \
            --output build-custom/telemetry.bin \
            --json-out build-custom/summary.json \
            --frames 3 \
            --timeout 20 \
            --qemu qemu-system-i386

          python - <<'PY'
          from pathlib import Path

          from envo_config import load_model_config
          from envo_reference import ReferenceModel
          from run_experiment import validate_trace_sequence

          config = load_model_config(Path("build-custom/experiment.json"))
          trace = Path("build-custom/telemetry.bin").read_bytes()
          frames = validate_trace_sequence(trace, config.telemetry_interval)
          reference_by_tick = {
              frame.tick: frame
              for frame in ReferenceModel(config).run(frames[-1].tick)
          }
          for index, frame in enumerate(frames):
              expected = reference_by_tick.get(frame.tick)
              if frame != expected:
                  raise SystemExit(
                      f"custom frame {index} differs from reference: "
                      f"guest={frame!r}; reference={expected!r}"
                  )
          last = frames[-1]
          if last.predator_starvations == 0 or last.starvations == 0:
              raise SystemExit(
                  "custom trace did not exercise both starvation paths"
              )
          if last.predator_replacements != (
              last.predator_starvations
              + last.predator_forager_turnovers
          ) & 0xFFFF:
              raise SystemExit("custom predator replacement accounting failed")
          if not (
              config.sense_min * config.prey_count
              <= last.prey_sense_sum
              <= config.sense_max * config.prey_count
          ):
              raise SystemExit("custom prey sense mutation escaped bounds")
          print(
              "custom event-path differential passed with "
              f"{last.starvations} prey and "
              f"{last.predator_starvations} predator starvations"
          )
          PY
